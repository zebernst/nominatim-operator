---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Opens/updates the release-please PR that bumps semver, changelog, and Chart.yaml.
# Uses a GitHub App token so tag/release events re-trigger the Release workflow
# (GITHUB_TOKEN-created releases do not).
name: Prepare Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Bump version (release-please)
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
