name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Add golangci-lint problem matcher
        run: echo "::add-matcher::.github/problem-matchers/golangci-lint.json"

      # Run golangci-lint directly (not via golangci-lint-action) so output is not
      # collapsed under ##[group]run golangci-lint in the job log.
      - name: Lint
        run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go mod tidy
          make test

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.32.0

      - name: Install kind
        env:
          KIND_VERSION: v0.27.0
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Create kind cluster
        run: kind create cluster --name kind --wait 120s

      - name: E2E (build, install operator, Nominatim reconcile smoke)
        run: |
          go mod tidy
          make test-e2e

  e2e-import:
    name: E2E Import
    runs-on: ubuntu-latest
    # Bootstrap + Reimport both run a full Monaco import; the go test timeout (110m in
    # test-e2e-import) is deliberately lower so Ginkgo reports before the job is killed.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.32.0

      - name: Install kind
        env:
          KIND_VERSION: v0.27.0
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Create kind cluster
        run: kind create cluster --name kind --wait 120s

      - name: E2E Import (CNPG + Monaco Bootstrap + search probe + Reimport DB reset)
        run: |
          go mod tidy
          make test-e2e-import
