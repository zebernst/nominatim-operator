name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Add golangci-lint problem matcher
        run: echo "::add-matcher::.github/problem-matchers/golangci-lint.json"

      # Run golangci-lint directly (not via golangci-lint-action) so output is not
      # collapsed under ##[group]run golangci-lint in the job log.
      - name: Lint
        run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check go modules are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Download modules
        run: go mod download

      - name: Test
        run: make test

      - name: Coverage gate
        run: ./hack/check-coverage.sh cover.out

  worker-shell:
    name: Worker shell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install bats and shellcheck
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck

      - name: Shellcheck worker scripts
        run: make shellcheck-worker

      - name: Bats (detect_continue_at / parse_regions / seed_project_env)
        run: make test-worker-shell

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.32.0

      - name: Install kind
        env:
          KIND_VERSION: v0.27.0
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Create kind cluster
        run: kind create cluster --name kind --wait 120s

      - name: Download modules
        run: go mod download

      - name: E2E (build, install operator, Nominatim reconcile smoke)
        run: make test-e2e

  e2e-import:
    name: E2E Import
    runs-on: ubuntu-latest
    # Bootstrap + Rebuild both run a full monaco+andorra import; the go test timeout (110m in
    # test-e2e-import) is deliberately lower so Ginkgo reports before the job is killed.
    # Smoke Contexts are skipped under E2E_IMPORT=1 (covered by the e2e job).
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.32.0

      - name: Install kind
        env:
          KIND_VERSION: v0.27.0
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Create kind cluster
        run: kind create cluster --name kind --wait 120s

      - name: Download modules
        run: go mod download

      - name: E2E Import (CNPG + monaco+andorra Bootstrap + country probes + Rebuild DB reset)
        run: make test-e2e-import
