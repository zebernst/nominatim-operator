---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

# Images build on every main push. Helm chart OCI publish is release/tag-only
# (home-operations litellm-operator / gatus-sidecar / chaski pattern).
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
    tags:
      # release-please tags without a v prefix
      - "[0-9]+.[0-9]+.[0-9]+"
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: zebernst
  CHART_OWNER: zebernst

jobs:
  build-operator:
    name: Build nominatim-operator
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/nominatim-operator
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=rolling,enable=${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=nominatim-operator
          cache-to: type=gha,mode=max,scope=nominatim-operator

  build-api:
    name: Build nominatim-api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/nominatim-api
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=rolling,enable=${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=nominatim-api
          cache-to: type=gha,mode=max,scope=nominatim-api

  build-worker:
    name: Build nominatim-worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/nominatim-worker
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=rolling,enable=${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=nominatim-worker
          cache-to: type=gha,mode=max,scope=nominatim-worker

  helm:
    name: Publish Helm chart (OCI)
    needs:
      - build-operator
      - build-api
      - build-worker
    if: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.release.tag_name || github.ref_name }}
      CHART_PATH: charts/nominatim-operator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.3

      - name: Install yq
        uses: mikefarah/yq@v4.45.1

      - name: Pin released operator image digest into the chart
        env:
          DIGEST: ${{ needs.build-operator.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "${DIGEST}" ] || { echo "operator build produced no digest"; exit 1; }
          yq -i '.image.digest = strenv(DIGEST)' "${CHART_PATH}/values.yaml"
          yq -i '.image.tag = ""' "${CHART_PATH}/values.yaml"

      - name: Helm dependency update
        run: helm dependency update "${CHART_PATH}"

      - name: Package Helm chart
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package "${CHART_PATH}" \
            --version "${VERSION}" \
            --app-version "${VERSION}" \
            --destination dist
          ls -la dist

      - name: Log in to GHCR (Helm)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${REGISTRY}" \
            -u "${{ github.actor }}" --password-stdin

      - name: Push chart to OCI
        run: |
          set -euo pipefail
          CHART_TGZ="dist/nominatim-operator-${VERSION}.tgz"
          helm push "${CHART_TGZ}" "oci://${REGISTRY}/${CHART_OWNER}/charts"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.2

      - name: Sign the published chart
        run: |
          cosign sign --yes \
            "${REGISTRY}/${CHART_OWNER}/charts/nominatim-operator:${VERSION}"
