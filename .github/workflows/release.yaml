---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

# Images build on every main push. Helm chart OCI publish is release/tag-only
# (home-operations litellm-operator / gatus-sidecar / chaski pattern).
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
    tags:
      # release-please tags without a v prefix
      - "[0-9]+.[0-9]+.[0-9]+"
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: zebernst
  CHART_OWNER: zebernst

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: nominatim-operator
            file: images/operator/Dockerfile
          - image: nominatim-api
            file: images/api/Dockerfile
          - image: nominatim-worker
            file: images/worker/Dockerfile
          - image: nominatim-ui
            file: images/ui/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=rolling,enable=${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Matrix job outputs are unreliable across legs; pass the operator digest via artifact.
      - name: Persist operator digest
        if: ${{ matrix.image == 'nominatim-operator' && (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')) }}
        run: |
          set -euo pipefail
          DIGEST="${{ steps.build.outputs.digest }}"
          [ -n "${DIGEST}" ] || { echo "operator build produced no digest"; exit 1; }
          echo "${DIGEST}" > operator-digest.txt

      - name: Upload operator digest
        if: ${{ matrix.image == 'nominatim-operator' && (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')) }}
        uses: actions/upload-artifact@v7
        with:
          name: operator-digest
          path: operator-digest.txt
          if-no-files-found: error

  helm:
    name: Publish Helm chart (OCI)
    needs: build
    if: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.release.tag_name || github.ref_name }}
      CHART_PATH: charts/nominatim-operator
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download operator digest
        uses: actions/download-artifact@v8
        with:
          name: operator-digest

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.3

      - name: Install yq
        uses: mikefarah/yq@v4.45.1

      - name: Pin released operator image digest into the chart
        run: |
          set -euo pipefail
          DIGEST="$(tr -d '[:space:]' < operator-digest.txt)"
          [ -n "${DIGEST}" ] || { echo "operator digest artifact empty"; exit 1; }
          export DIGEST
          yq -i '.image.digest = strenv(DIGEST)' "${CHART_PATH}/values.yaml"
          yq -i '.image.tag = ""' "${CHART_PATH}/values.yaml"

      - name: Helm dependency update
        run: helm dependency update "${CHART_PATH}"

      - name: Package Helm chart
        run: |
          set -euo pipefail
          mkdir -p build/dist
          helm package "${CHART_PATH}" \
            --version "${VERSION}" \
            --app-version "${VERSION}" \
            --destination build/dist
          ls -la build/dist

      - name: Log in to GHCR (Helm)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${REGISTRY}" \
            -u "${{ github.actor }}" --password-stdin

      - name: Push chart to OCI
        run: |
          set -euo pipefail
          CHART_TGZ="build/dist/nominatim-operator-${VERSION}.tgz"
          helm push "${CHART_TGZ}" "oci://${REGISTRY}/${CHART_OWNER}/charts"

      - name: Log in to GHCR (Cosign)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign the published chart
        run: |
          cosign sign --yes \
            "${REGISTRY}/${CHART_OWNER}/charts/nominatim-operator:${VERSION}"
