apiVersion: nominatim.zebernst.dev/v1alpha1
kind: NominatimOperation
metadata:
  name: monaco-rebuild
  namespace: nominatim-validation
  labels:
    app.kubernetes.io/part-of: nominatim-validation
spec:
  type: Rebuild
  nominatimInstanceRef:
    name: monaco
  # Keep aligned with the parent Spec so Rebuild does not leave Andorra as drift
  # and spawn an AddRegions Operation mid-suite.
  regions:
    - europe/monaco
    - europe/andorra
  image:
    repository: example.com/nominatim-worker
    tag: e2e
    pullPolicy: IfNotPresent
