# Reserved Operation types must fail fast as NotImplemented with no Job / staging PVC.
# Refresh is implemented (nominatim-5et.12); Migrate/Freeze remain reserved.
apiVersion: nominatim.zebernst.dev/v1alpha1
kind: NominatimOperation
metadata:
  name: smoke-migrate
  namespace: nominatim-e2e
spec:
  type: Migrate
  nominatimRef:
    name: smoke
---
apiVersion: nominatim.zebernst.dev/v1alpha1
kind: NominatimOperation
metadata:
  name: smoke-freeze
  namespace: nominatim-e2e
spec:
  type: Freeze
  nominatimRef:
    name: smoke
