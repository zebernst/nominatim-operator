apiVersion: v1
kind: Namespace
metadata:
  name: nominatim-validation
  labels:
    app.kubernetes.io/part-of: nominatim-validation
    # CNPG needs broader privileges than restricted PSA.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nominatim-project
  namespace: nominatim-validation
  labels:
    app.kubernetes.io/part-of: nominatim-validation
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: nominatim.zebernst.dev/v1alpha1
kind: NominatimInstance
metadata:
  name: monaco
  namespace: nominatim-validation
  labels:
    app.kubernetes.io/part-of: nominatim-validation
spec:
  # Two tiny Geofabrik extracts so Bootstrap exercises multi --osm-file (not add-data).
  # A regression that only imported regions[0] while marking every Spec region Imported
  # would still pass a Monaco-only search; country-scoped probes catch that.
  # (The monaco-only fixture remains for hack/validate-kind.sh day-2 AddRegions.)
  regions:
    - europe/monaco
    - europe/andorra
  regionChangePolicy: AddData
  # Small aux download (~400KiB) so Bootstrap + sequence probe exercise status.auxData
  # without pulling the ~300MiB Wikipedia importance dump.
  auxData:
    usPostcodes: true
  project:
    volume:
      claimName: nominatim-project
  staging:
    size: 5Gi
  database:
    cluster:
      instances: 1
      storage:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
  worker:
    image:
      repository: example.com/nominatim-worker
      tag: e2e
      pullPolicy: IfNotPresent
  api:
    # Serving plane is DB+env only (no project PVC). replicas may be >1 in prod;
    # project remains RWO for worker Jobs.
    replicas: 1
    # Day-2 only. Bootstrap never creates API/UI until status.regions is set.
    # Reimport always quiesces the API (DROP DATABASE), but BootstrapReimport also
    # covers day-2 Bootstrap-style work when suspendDuringOperations is honored.
    suspendDuringOperations: BootstrapReimport
    image:
      repository: example.com/nominatim-api
      tag: e2e
      pullPolicy: IfNotPresent
