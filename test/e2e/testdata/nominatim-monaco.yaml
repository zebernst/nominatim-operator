apiVersion: v1
kind: Namespace
metadata:
  name: nominatim-validation
  labels:
    app.kubernetes.io/part-of: nominatim-validation
    # CNPG needs broader privileges than restricted PSA.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nominatim-project
  namespace: nominatim-validation
  labels:
    app.kubernetes.io/part-of: nominatim-validation
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: nominatim.zebernst.dev/v1alpha1
kind: Nominatim
metadata:
  name: monaco
  namespace: nominatim-validation
  labels:
    app.kubernetes.io/part-of: nominatim-validation
spec:
  regions:
    - europe/monaco
  regionChangePolicy: AddData
  project:
    volume:
      claimName: nominatim-project
  staging:
    size: 5Gi
  database:
    cluster:
      instances: 1
      storage:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
  worker:
    image:
      repository: example.com/nominatim-worker
      tag: e2e
      pullPolicy: IfNotPresent
  api:
    # Serving plane is DB+env only (no project PVC). replicas may be >1 in prod;
    # project remains RWO for worker Jobs.
    replicas: 1
    # Day-2 only. Bootstrap never creates API/UI until status.regions is set.
    # Reimport always quiesces the API (DROP DATABASE), but BootstrapReimport also
    # covers day-2 Bootstrap-style work when suspendDuringOperations is honored.
    suspendDuringOperations: BootstrapReimport
    image:
      repository: example.com/nominatim-api
      tag: e2e
      pullPolicy: IfNotPresent
