# This rule is not used by the project nominatim-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to nominatim.zebernst.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: nominatim-operator
    app.kubernetes.io/managed-by: kustomize
  name: nominatim-viewer-role
rules:
- apiGroups:
  - nominatim.zebernst.dev
  resources:
  - nominatims
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - nominatim.zebernst.dev
  resources:
  - nominatims/status
  verbs:
  - get
