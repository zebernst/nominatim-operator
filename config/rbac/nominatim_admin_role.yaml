# This rule is not used by the project nominatim-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over nominatim.zebernst.dev.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: nominatim-operator
    app.kubernetes.io/managed-by: kustomize
  name: nominatim-admin-role
rules:
- apiGroups:
  - nominatim.zebernst.dev
  resources:
  - nominatims
  verbs:
  - '*'
- apiGroups:
  - nominatim.zebernst.dev
  resources:
  - nominatims/status
  verbs:
  - get
