apiVersion: nominatim.zebernst.dev/v1alpha1
kind: NominatimInstance
metadata:
  labels:
    app.kubernetes.io/name: nominatim-operator
    app.kubernetes.io/managed-by: kustomize
  name: nominatim-sample
spec:
  # Project PVC is for worker Jobs (and a short read-only sequence probe). RWO is fine.
  # The API never mounts project or flatnode — see docs/concepts.md.
  project:
    volume:
      claimName: nominatim-project
  # flatnode:
  #   volume:
  #     claimName: nominatim-flatnode  # Jobs only
  regions:
    - north-america/us
  regionChangePolicy: AddData
  # Optional aux downloads during Bootstrap (see docs/configuration.md).
  # auxData:
  #   wikimediaImportance: true
  #   secondaryImportance: true
  #   usPostcodes: true
  # Typed Nominatim settings (prefer over NOMINATIM_* in podSpec).
  # ImportStyle/Tokenizer seal after Bootstrap; changing them needs Rebuild.
  # nominatim:
  #   importStyle: extratags
  #   tokenizer: icu
  #   languages: ["en"]
  #   replication:
  #     updateIntervalSeconds: 86400
  #   api:
  #     poolSize: 10
  #     queryTimeoutSeconds: 10
  #     requestTimeoutSeconds: 60
  #     defaultLanguage: en
  #     corsNoAccessControl: true
  #
  # Postgres: exactly one of cluster | clusterRef | connectionSecretRef.
  # For CNPG backup/restore, author a Cluster with backup and use clusterRef
  # (docs/database.md). Owned database.cluster does not expose backup knobs.
  database:
    clusterRef:
      name: nominatim-pg
      # Optional override of the default CNPG "{name}-app" Secret:
      # connectionSecretRef:
      #   name: nominatim-pg-app
  # Degraded attach (no Cluster manage / profiles / backup pause):
  # database:
  #   connectionSecretRef:
  #     name: nominatim-pg-credentials
  updates:
    enabled: true
    schedule: "0 3 * * *"
  api:
    # Stateless serving; replicas may be >1. Project/flatnode stay Jobs-only.
    replicas: 1
    # gunicornWorkers: 2
    # Day-2: Never keeps API up during AddRegions/Update. Rebuild always scales API down.
    suspendDuringOperations: Never
    # podSpec:
    #   nodeSelector:
    #     disktype: ssd
  # Optional UI. Omit or enabled: false for API/DB-only.
  # ui:
  #   enabled: true
  #   route:
  #     parentRefs:
  #       - name: my-gateway
  #     hostnames:
  #       - nominatim-ui.example.com
  # worker:
  #   image:
  #     repository: ghcr.io/zebernst/nominatim-worker
  #     tag: latest
  # Owned Cluster (alternative to clusterRef) — basic knobs only:
  # database:
  #   cluster:
  #     instances: 1
  #     storage:
  #       spec:
  #         accessModes: [ReadWriteOnce]
  #         resources:
  #           requests:
  #             storage: 50Gi
