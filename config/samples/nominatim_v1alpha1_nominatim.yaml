apiVersion: nominatim.zebernst.dev/v1alpha1
kind: Nominatim
metadata:
  labels:
    app.kubernetes.io/name: nominatim-operator
    app.kubernetes.io/managed-by: kustomize
  name: nominatim-sample
spec:
  project:
    volume:
      claimName: nominatim-project
  regions:
    - north-america/us
  regionChangePolicy: AddData
  # Typed Nominatim settings (preferred over NOMINATIM_* in podSpec).
  # ImportStyle/Tokenizer seal after Bootstrap; change requires Reimport.
  # nominatim:
  #   importStyle: extratags
  #   tokenizer: icu
  #   languages: ["en"]
  #   replication:
  #     updateIntervalSeconds: 86400
  #   api:
  #     poolSize: 10
  #     queryTimeoutSeconds: 10
  #     requestTimeoutSeconds: 60
  #     defaultLanguage: en
  #     corsNoAccessControl: true
  database:
    clusterRef:
      name: nominatim-pg
      # Optional: override the default CNPG "{name}-app" credentials Secret.
      # connectionSecretRef:
      #   name: nominatim-pg-app
  updates:
    enabled: true
    schedule: "0 3 * * *"
  api:
    replicas: 1
    # Optional: pin Gunicorn workers; when unset, entrypoint uses cgroup CPU quota.
    # gunicornWorkers: 2
    # Day-2 only (Never = keep API up during AddRegions/Update/…).
    # Bootstrap does not use this: serving workloads wait for status.regions.
    # Default probes: GET /status (startup/readiness/liveness); override via podSpec.
    suspendDuringOperations: Never
    # Optional podSpec overlay (affinity/resources/probes/…). Sibling image seals container image.
    # podSpec:
    #   nodeSelector:
    #     disktype: ssd
  # worker:
  #   image:
  #     repository: ghcr.io/zebernst/nominatim-worker
  #     tag: latest
  #   # Optional Job podSpec overlay (also used by Update Jobs).
  #   # podSpec:
  #   #   tolerations: []
  # Owned Cluster create (alternative to clusterRef) also accepts resources/affinity/
  # topologySpreadConstraints. For full CNPG (backup, custom bootstrap), use clusterRef.
  # database:
  #   cluster:
  #     instances: 1
  #     storage:
  #       spec:
  #         accessModes: [ReadWriteOnce]
  #         resources:
  #           requests:
  #             storage: 50Gi
  #     resources:
  #       requests:
  #         memory: 1Gi
  #     affinity:
  #       nodeSelector:
  #         node-role.kubernetes.io/postgres: ""
